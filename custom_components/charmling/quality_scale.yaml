rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: Nothing is polled; the Mac pushes.
  brands:
    status: done
    comment: Shipped in the integration's brand/ folder (Home Assistant 2026.3+).
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: No dependencies beyond Home Assistant.
  docs-actions: done
  docs-triggers: done
  docs-conditions:
    status: exempt
    comment: No device conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: The Mac being asleep at setup is normal; entities are unavailable until it speaks.
  unique-config-entry: done
  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done
  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: done
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One Mac per config entry.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: The only intervention is a re-pair, which is a reauth flow.
  stale-devices:
    status: exempt
    comment: One Mac per config entry; deleting the entry deletes the device.
  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
